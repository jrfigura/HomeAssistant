blueprint:
  name: "ZHA - TS004F Rotary Knob"
  description: |
    Full blueprint for Tuya TS004F. 
    Matches the custom quirk's device_automation_triggers mapping.
    https://github.com/jrfigura/HomeAssistant/blob/main/zha_custom_quirks/ts004f_402vrq2i.py
  domain: automation
  input:
    remote:
      name: TS004F Rotary Knob
      selector:
        device:
          integration: zha
          model: TS004F
    rotation_debounce_delay:
      name: Rotation Debounce Delay (ms)
      default: 100
      selector:
        number:
          min: 0
          max: 1000
          step: 50
          unit_of_measurement: "ms"
          mode: slider

    # ACTION INPUTS
    button_single_press:
      name: Single Press
      default: []
      selector: { action: {} }
    button_double_press:
      name: Double Press
      default: []
      selector: { action: {} }
    button_long_press:
      name: Long Press
      default: []
      selector: { action: {} }
    rotate_left:
      name: Rotate Left
      default: []
      selector: { action: {} }
    rotate_right:
      name: Rotate Right
      default: []
      selector: { action: {} }

mode: restart
max_exceeded: silent

trigger:
  # --- Button Triggers ---
  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_short_press
    subtype: button
    id: button_short

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_double_press
    subtype: button_1
    id: button_double

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_long_press
    subtype: button_1
    id: button_long

  # --- Rotation Triggers ---
  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_rotate
    subtype: left
    id: rotate_left_trigger

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_rotate
    subtype: right
    id: rotate_right_trigger

action:
  - choose:
      # SINGLE PRESS
      - conditions:
          - condition: trigger
            id: button_short
        sequence: !input button_single_press

      # DOUBLE PRESS
      - conditions:
          - condition: trigger
            id: button_double
        sequence: !input button_double_press

      # LONG PRESS
      - conditions:
          - condition: trigger
            id: button_long
        sequence: !input button_long_press

      # ROTATE LEFT
      - conditions:
          - condition: trigger
            id: rotate_left_trigger
        sequence:
          - delay: { milliseconds: !input rotation_debounce_delay }
          - choose: []
            default: !input rotate_left

      # ROTATE RIGHT
      - conditions:
          - condition: trigger
            id: rotate_right_trigger
        sequence:
          - delay: { milliseconds: !input rotation_debounce_delay }
          - choose: []
            default: !input rotate_right