blueprint:
  name: "ZHA - TS004F Rotary Knob (Modernized)"
  description: |
    Complete blueprint for Tuya TS004F rotary knob.
    Works with the custom quirk for _TZ3000_402vrq2i:
    https://github.com/jrfigura/HomeAssistant/blob/main/zha_custom_quirks/ts004f_402vrq2i.py
    
    Supports:
    - Dimmer Mode (Command: step)
    - Scene Mode (Command: left/right)
    - Press & Rotate (Command: step_color_temp)
    - Single, Double, and Long Press actions
  domain: automation
  input:
    remote:
      name: TS004F Rotary Knob
      description: Select your TS004F device
      selector:
        device:
          integration: zha
          model: TS004F

    rotation_debounce_delay:
      name: Rotation Debounce Delay (ms)
      description: Prevents accidental rotation triggers when clicking.
      default: 100
      selector:
        number:
          min: 0
          max: 1000
          step: 50
          unit_of_measurement: "ms"
          mode: slider

    # ACTIONS
    button_single_press:
      name: Single Press
      default: []
      selector: { action: {} }
    button_double_press:
      name: Double Press
      default: []
      selector: { action: {} }
    button_long_press:
      name: Long Press
      default: []
      selector: { action: {} }
    rotate_left:
      name: Rotate Left
      default: []
      selector: { action: {} }
    rotate_right:
      name: Rotate Right
      default: []
      selector: { action: {} }

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      # Extract command and params for cleaner templates
      command: "{{ trigger.event.data.command }}"
      params: "{{ trigger.event.data.params }}"
      # Handle both raw int and dict/object styles for step_mode
      step_mode: >
        {% if params.step_mode is defined %}
          {% if params.step_mode is mapping %} {{ params.step_mode.value }}
          {% else %} {{ params.step_mode }} {% endif %}
        {% else %} none {% endif %}

  - choose:
      # --- BUTTON PRESSES ---
      # Single Press (Dimmer mode uses 'toggle', Scene mode uses 'press_type' 0)
      - conditions:
          - condition: template
            value_template: "{{ command == 'toggle' or (command == 'press_type' and params.press_type == 0) }}"
        sequence: !input button_single_press

      # Double Press (Scene mode uses 'press_type' 1)
      - conditions:
          - condition: template
            value_template: "{{ command == 'press_type' and params.press_type == 1 }}"
        sequence: !input button_double_press

      # Long Press (Scene mode uses 'press_type' 2)
      - conditions:
          - condition: template
            value_template: "{{ command == 'press_type' and params.press_type == 2 }}"
        sequence: !input button_long_press

      # --- ROTATION (RIGHT) ---
      # Matches 'step' (Dimmer mode), 'right' (Scene mode), or 'step_color_temp' (Hold + Turn)
      - conditions:
          - condition: template
            value_template: >
              {{ (command == 'step' and step_mode|int == 0) or 
                 (command == 'right') or
                 (command == 'step_color_temp' and step_mode|int == 1) }}
        sequence:
          - delay: { milliseconds: !input rotation_debounce_delay }
          - choose: []
            default: !input rotate_right

      # --- ROTATION (LEFT) ---
      # Matches 'step' (Dimmer mode), 'left' (Scene mode), or 'step_color_temp' (Hold + Turn)
      - conditions:
          - condition: template
            value_template: >
              {{ (command == 'step' and step_mode|int == 1) or 
                 (command == 'left') or
                 (command == 'step_color_temp' and step_mode|int == 3) }}
        sequence:
          - delay: { milliseconds: !input rotation_debounce_delay }
          - choose: []
            default: !input rotate_left