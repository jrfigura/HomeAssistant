blueprint:
  name: "ZHA - TS004F Rotary Knob"
  description: |
    Complete blueprint for Tuya TS004F rotary knob with DEVICE TRIGGERS.
    
    Works with the custom quirk for _TZ3000_402vrq2i that uses
    device_automation_triggers (not raw zha_events).
    https://github.com/jrfigura/HomeAssistant/blob/main/zha_custom_quirks/ts004f_402vrq2i.py
    
    Supports:
    - Single, Double, and Long Press actions
    - Rotate Left/Right
    - Optional debounce delay for rotation
    
    Compatible with Scene Mode quirk that sends:
    - press_type commands for button presses
    - left/right commands for rotation
  domain: automation
  input:
    remote:
      name: TS004F Rotary Knob
      description: Select your TS004F device
      selector:
        device:
          integration: zha
          model: TS004F
    rotation_debounce_delay:
      name: Rotation Debounce Delay (ms)
      description: Prevents accidental rotation triggers when clicking button.
      default: 100
      selector:
        number:
          min: 0
          max: 1000
          step: 50
          unit_of_measurement: "ms"
          mode: slider
    # ACTIONS
    button_single_press:
      name: Single Press
      description: Action to run on single button press
      default: []
      selector:
        action: {}
    button_double_press:
      name: Double Press
      description: Action to run on double button press
      default: []
      selector:
        action: {}
    button_long_press:
      name: Long Press
      description: Action to run on long button press
      default: []
      selector:
        action: {}
    rotate_left:
      name: Rotate Left
      description: Action to run when rotating counter-clockwise
      default: []
      selector:
        action: {}
    rotate_right:
      name: Rotate Right
      description: Action to run when rotating clockwise
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

trigger:
  # Button Press Triggers (from device_automation_triggers)
  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_short_press
    subtype: button
    id: button_short

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_double_press
    subtype: button
    id: button_double

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_button_long_press
    subtype: button
    id: button_long

  # Rotation Triggers (from device_automation_triggers)
  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_rotate
    subtype: left
    id: rotate_left

  - platform: device
    device_id: !input remote
    domain: zha
    type: remote_rotate
    subtype: right
    id: rotate_right

action:
  - choose:
      # --- BUTTON PRESSES ---
      - conditions:
          - condition: trigger
            id: button_short
        sequence: !input button_single_press

      - conditions:
          - condition: trigger
            id: button_double
        sequence: !input button_double_press

      - conditions:
          - condition: trigger
            id: button_long
        sequence: !input button_long_press

      # --- ROTATION WITH DEBOUNCE ---
      - conditions:
          - condition: trigger
            id: rotate_left
        sequence:
          - delay:
              milliseconds: !input rotation_debounce_delay
          - choose: []
            default: !input rotate_left

      - conditions:
          - condition: trigger
            id: rotate_right
        sequence:
          - delay:
              milliseconds: !input rotation_debounce_delay
          - choose: []
            default: !input rotate_right